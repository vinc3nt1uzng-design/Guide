<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINCEGUIDE - Blox Fruits Ultimate Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #ff6b35;
            --secondary: #f7931e;
            --dark: #0a0a0a;
            --darker: #050505;
            --card: #151515;
            --text: #ffffff;
            --text-secondary: #b0b0b0;
            --mythical: #ff006e;
            --legendary: #ffd700;
            --rare: #00b4d8;
            --uncommon: #06ffa5;
            --common: #b0b0b0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--darker) 0%, var(--dark) 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .floating-fruit {
            position: absolute;
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            33% { transform: translateY(-100px) translateX(50px); }
            66% { transform: translateY(50px) translateX(-50px); }
        }

        /* Header */
        header {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(255, 107, 53, 0.3);
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px var(--primary)); }
            to { filter: drop-shadow(0 0 20px var(--secondary)); }
        }

        .last-update {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background: #00ff00;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Navigation */
        nav {
            background: var(--card);
            padding: 1rem;
            position: sticky;
            top: 80px;
            z-index: 999;
            border-bottom: 1px solid rgba(255, 107, 53, 0.2);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-container::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            padding: 0.8rem 1.5rem;
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--text);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            white-space: nowrap;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.4);
        }

        /* Main Content */
        main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }

        .section {
            display: none;
            animation: fadeIn 0.5s;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        /* Tier List Section */
        .tier-container {
            display: grid;
            gap: 1.5rem;
        }

        .tier-row {
            background: var(--card);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }

        .tier-row:hover {
            transform: translateX(10px);
        }

        .tier-header {
            padding: 1.5rem;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .tier-s { background: linear-gradient(90deg, #ff006e, #ff4d9e); }
        .tier-a { background: linear-gradient(90deg, #ffd700, #ffed4e); color: #000; }
        .tier-b { background: linear-gradient(90deg, #00b4d8, #90e0ef); }
        .tier-c { background: linear-gradient(90deg, #06ffa5, #4effc9); color: #000; }
        .tier-d { background: linear-gradient(90deg, #b0b0b0, #e0e0e0); color: #000; }

        .tier-content {
            padding: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        .fruit-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .fruit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: 0.5s;
        }

        .fruit-card:hover::before {
            left: 100%;
        }

        .fruit-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
        }

        .fruit-icon {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
            border-radius: 50%;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }

        .fruit-name {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .fruit-type {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        /* Guide Section */
        .guide-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .guide-card {
            background: var(--card);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(255, 107, 53, 0.2);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .guide-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 53, 0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .guide-card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
        }

        .guide-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .guide-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .guide-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .guide-list {
            list-style: none;
            margin-top: 1rem;
        }

        .guide-list li {
            padding: 0.5rem 0;
            padding-left: 1.5rem;
            position: relative;
        }

        .guide-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--primary);
        }

        /* Update Section */
        .update-timeline {
            position: relative;
            padding-left: 3rem;
        }

        .update-timeline::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .update-item {
            background: var(--card);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            border: 1px solid rgba(255, 107, 53, 0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .update-item::before {
            content: '';
            position: absolute;
            left: -3.4rem;
            top: 2rem;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            border: 4px solid var(--dark);
            box-shadow: 0 0 0 4px var(--primary);
        }

        .update-date {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .update-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .update-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .update-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .update-changes {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .change-item {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .change-added { color: #06ffa5; }
        .change-removed { color: #ff006e; }
        .change-fixed { color: #ffd700; }

        /* PvP Section */
        .pvp-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary), var(--secondary));
            border-radius: 2px;
        }

        .update-item {
            background: var(--card);
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
            border: 1px solid rgba(255, 107, 53, 0.2);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .update-item::before {
            content: '';
            position: absolute;
            left: -3.4rem;
            top: 2rem;
            width: 20px;
            height: 20px;
            background: var(--primary);
            border-radius: 50%;
            border: 4px solid var(--dark);
            box-shadow: 0 0 0 4px var(--primary);
        }

        .update-date {
            color: var(--primary);
            font-weight: 700;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .update-badge {
            background: var(--primary);
            color: white;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .update-title {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .update-content {
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .update-changes {
            margin-top: 1rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .change-item {
            padding: 0.5rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .change-added { color: #06ffa5; }
        .change-removed { color: #ff006e; }
        .change-fixed { color: #ffd700; }

        /* PvP Section */
        .pvp-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .pvp-container { grid-template-columns: 1fr; }
        }

        .combo-builder {
            background: var(--card);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid var(--primary);
        }

        .combo-display {
            min-height: 200px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 1rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-content: flex-start;
        }

        .combo-move {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-weight: 700;
            animation: popIn 0.3s;
            cursor: pointer;
            transition: all 0.2s;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        .combo-move:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.5);
        }

        .moves-palette {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .move-btn {
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 107, 53, 0.3);
            color: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .move-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        .tips-grid {
            display: grid;
            gap: 1rem;
        }

        .tip-card {
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.1), rgba(247, 147, 30, 0.1));
            border: 1px solid rgba(255, 107, 53, 0.3);
            border-radius: 15px;
            padding: 1.5rem;
            transition: all 0.3s;
        }

        .tip-card:hover {
            transform: translateX(10px);
            background: linear-gradient(135deg, rgba(255, 107, 53, 0.2), rgba(247, 147, 30, 0.2));
        }

        .tip-number {
            font-size: 2rem;
            font-weight: 900;
            color: var(--primary);
            opacity: 0.5;
        }

        /* Auto Update Notification */
        .update-notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--card);
            border: 2px solid var(--primary);
            border-radius: 15px;
            padding: 1.5rem;
            max-width: 350px;
            transform: translateX(400px);
            transition: transform 0.3s;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .update-notification.show {
            transform: translateX(0);
        }

        .notification-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        /* Loading Skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 10px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo { font-size: 1.5rem; }
            .section-title { font-size: 1.8rem; }
            .tier-content { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
        }
    </style>
</head>

        <!-- Updates Section -->

        <!-- PvP Section -->

                    </div>
                    <div class="moves-palette" id="movesPalette">

                    </div>
                    <button class="nav-btn" style="margin-top: 1rem; width: 100%;" onclick="clearCombo()">Clear Combo</button>
                </div>
                <div class="tips-grid" id="pvpTips">
