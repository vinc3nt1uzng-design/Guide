<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Stories & Games Collection</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .search-container {
            max-width: 500px; margin: 0 auto 30px; text-align: center;
        }
        input[type="text"] {
            width: 70%; padding: 12px; font-size: 16px; border: none; border-radius: 25px 0 0 25px;
            outline: none; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button {
            padding: 12px 20px; font-size: 16px; border: none; background: #ff6b6b; color: white;
            border-radius: 0 25px 25px 0; cursor: pointer; transition: background 0.3s;
        }
        button:hover { background: #ff5252; }
        .filter-btns { text-align: center; margin-bottom: 30px; }
        .filter-btn { 
            margin: 0 10px; padding: 10px 20px; background: rgba(255,255,255,0.2); 
            border: none; border-radius: 20px; color: white; cursor: pointer; transition: all 0.3s;
        }
        .filter-btn.active, .filter-btn:hover { background: #ff6b6b; transform: scale(1.05); }
        .grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px; max-width: 1200px; margin: 0 auto;
        }
        .card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 20px; text-align: center;
            transition: all 0.3s; border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        .card:hover {
            transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            background: rgba(255,255,255,0.2);
        }
        .card h3 { font-size: 1.5em; margin-bottom: 10px; color: #ffeb3b; }
        .card p { line-height: 1.5; margin-bottom: 10px; }
        .genre { 
            display: inline-block; background: #ff6b6b; padding: 5px 12px;
            border-radius: 15px; font-size: 0.9em; margin-top: 10px;
        }
        .no-results { text-align: center; font-size: 1.2em; margin-top: 50px; }
    </style>
</head>
<body>
    <h1>🍥 Anime Stories & Games Collection 🍜</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search by name, genre, or description...">
        <button onclick="searchItems()">🔍 Search</button>
    </div>
    
    <div class="filter-btns">
        <button class="filter-btn active" onclick="filterItems('all')">All</button>
        <button class="filter-btn" onclick="filterItems('anime')">Anime</button>
        <button class="filter-btn" onclick="filterItems('game')">Games</button>
    </div>

    <div id="grid" class="grid"></div>

    <script>
        const items = [
            // Anime Stories
            { id: 1, title: "Naruto", type: "anime", genre: "Action, Adventure", desc: "A young ninja's journey to become Hokage and protect his village." },
            { id: 2, title: "Attack on Titan", type: "anime", genre: "Dark Fantasy, Action", desc: "Humanity fights giant Titans in a post-apocalyptic world." },
            { id: 3, title: "One Piece", type: "anime", genre: "Adventure, Pirates", desc: "Luffy searches for the ultimate treasure with his pirate crew." },
            { id: 4, title: "Demon Slayer", type: "anime", genre: "Action, Supernatural", desc: "Tanjiro battles demons to save his sister and avenge his family." },
            { id: 5, title: "Death Note", type: "anime", genre: "Thriller, Mystery", desc: "A notebook that kills anyone whose name is written in it." },
            { id: 6, title: "My Hero Academia", type: "anime", genre: "Superhero, Action", desc: "Izuku inherits superpowers in a world of heroes and villains." },
            { id: 7, title: "Fullmetal Alchemist: Brotherhood", type: "anime", genre: "Adventure, Fantasy", desc: "Brothers seek the Philosopher's Stone after a failed alchemy experiment." },
            { id: 8, title: "Jujutsu Kaisen", type: "anime", genre: "Action, Supernatural", desc: "Yuji eats a cursed finger and joins the fight against curses." },

            // Games (Anime-style or popular with anime adaptations)
            { id: 9, title: "Genshin Impact", type: "game", genre: "Open-World RPG", desc: "Explore Teyvat as a Traveler searching for a lost sibling." },
            { id: 10, title: "Persona 5 Royal", type: "game", genre: "JRPG, Turn-Based", desc: "Phantom Thieves steal corrupt hearts in modern Tokyo." },
            { id: 11, title: "Nier: Automata", type: "game", genre: "Action RPG", desc: "Androids fight machines in a post-human world." },
            { id: 12, title: "Final Fantasy VII Remake", type: "game", genre: "Action RPG", desc: "Cloud and Avalanche fight Shinra in Midgar." },
            { id: 13, title: "Elden Ring", type: "game", genre: "Open-World Action RPG", desc: "Become the Elden Lord in a vast fantasy world." },
            { id: 14, title: "Honkai: Star Rail", type: "game", genre: "Turn-Based RPG", desc: "Space adventure on the Astral Express across the galaxy." },
            { id: 15, title: "Zenless Zone Zero", type: "game", genre: "Action RPG", desc: "Fight in the mysterious Hollows of New Eridu." },
            { id: 16, title: "Blue Archive", type: "game", genre: "Gacha RPG", desc: "Sensei leads students in tactical battles at Kivotos Academy." }
        ];

        function renderItems(filteredItems) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (filteredItems.length === 0) {
                grid.innerHTML = '<div class="no-results">No results found! Try another search. 😿</div>';
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => alert(`Check out ${item.title}!\n${item.desc}`);
                card.innerHTML = `
                    <h3>${item.title}</h3>
                    <p>${item.desc}</p>
                    <span class="genre">${item.genre}</span>
                `;
                grid.appendChild(card);
            });
        }

        function searchItems() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = items.filter(item =>
                item.title.toLowerCase().includes(query) ||
                item.genre.toLowerCase().includes(query) ||
                item.desc.toLowerCase().includes(query)
            );
            renderItems(filtered);
        }

        function filterItems(type) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            let filtered;
            if (type === 'all') filtered = items;
            else filtered = items.filter(item => item.type === type);
            
            renderItems(filtered);
        }

        // Initial render
        renderItems(items);

        // Real-time search
        document.getElementById('searchInput').addEventListener('input', searchItems);
    </script>
</body>
</html>
