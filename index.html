<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINCEGUIDE - Blox Fruits Quest Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #00d4ff;
            --primary-purple: #8b5cf6;
            --dark-bg: #0a0a0f;
            --card-bg: #12121a;
            --border-color: #1e1e2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --accent-glow: rgba(139, 92, 246, 0.3);
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--dark-bg);
            color: var(--text-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            animation: bgPulse 8s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(10, 10, 15, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 1rem 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--primary-blue);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple));
            transition: width 0.3s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Hero Section */
        .hero {
            margin-top: 80px;
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple), var(--primary-blue));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        .hero p {
            font-size: 1.3rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        /* Controls */
        .controls {
            max-width: 1400px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 300px;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 1rem 1.5rem 1rem 3rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            transition: all 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary-purple);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .filter-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-secondary);
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            border-color: var(--primary-purple);
            color: var(--primary-blue);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Category Tabs */
        .category-tabs {
            max-width: 1400px;
            margin: 0 auto 2rem;
            padding: 0 2rem;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .category-tabs::-webkit-scrollbar {
            display: none;
        }

        .category-tab {
            padding: 1rem 2rem;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-secondary);
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .category-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .category-tab:hover::before {
            left: 100%;
        }

        .category-tab.active {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(0, 212, 255, 0.2));
            border-color: var(--primary-purple);
            color: var(--text-primary);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* Quest Grid */
        .quest-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .quest-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }

        .quest-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .quest-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-purple));
            transform: scaleX(0);
            transition: transform 0.3s;
        }

        .quest-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-purple);
            box-shadow: 0 10px 40px rgba(139, 92, 246, 0.2);
        }

        .quest-card:hover::before {
            transform: scaleX(1);
        }

        .quest-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 1rem;
        }

        .quest-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .quest-sea {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            background: rgba(0, 212, 255, 0.1);
            border: 1px solid var(--primary-blue);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-blue);
        }

        .quest-info {
            display: grid;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .info-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .info-label {
            font-weight: 600;
            color: var(--primary-purple);
        }

        .quest-reward {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .reward-tag {
            padding: 0.3rem 0.8rem;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid var(--primary-purple);
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--primary-purple);
        }

        .view-guide-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(135deg, var(--primary-purple), var(--primary-blue));
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .view-guide-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(139, 92, 246, 0.4);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: start;
            padding: 2rem;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            max-width: 800px;
            width: 100%;
            position: relative;
            animation: modalSlide 0.3s ease;
        }

        @keyframes modalSlide {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            padding: 2rem;
            border-bottom: 2px solid var(--border-color);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 0, 0, 0.3);
            transform: rotate(90deg);
        }

        .modal-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-body {
            padding: 2rem;
        }

        .guide-section {
            margin-bottom: 2rem;
        }

        .guide-section h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary-blue);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .guide-section ol {
            padding-left: 1.5rem;
        }

        .guide-section li {
            margin-bottom: 0.8rem;
            color: var(--text-secondary);
            line-height: 1.8;
        }

        .guide-section li::marker {
            color: var(--primary-purple);
            font-weight: bold;
        }

        .tip-box {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid var(--primary-blue);
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-top: 1rem;
        }

        .tip-box strong {
            color: var(--primary-blue);
        }

        .stats-bar {
            display: flex;
            gap: 2rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stat-icon {
            width: 40px;
            height: 40px;
            background: rgba(139, 92, 246, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .stat-value {
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .hero {
                padding: 2rem 1rem;
            }

            .quest-grid {
                grid-template-columns: 1fr;
            }

            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            .category-tabs {
                padding: 0 1rem;
            }

            .modal-content {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary-purple);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-blue);
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 0.5rem;
        }

        .difficulty-easy { background: rgba(0, 255, 0, 0.2); color: #00ff00; }
        .difficulty-medium { background: rgba(255, 165, 0, 0.2); color: #ffa500; }
        .difficulty-hard { background: rgba(255, 0, 0, 0.2); color: #ff0000; }
        .difficulty-extreme { background: rgba(148, 0, 211, 0.2); color: #9400d3; }
    </style>
</head>

        // Initialize
        let currentFilter = 'all';
        let currentCategory = 'all';
        let searchTerm = '';

        function renderQuests() {
            const grid = document.getElementById('questGrid');
            grid.innerHTML = '';

            const filtered = quests.filter(quest => {
                const matchFilter = currentFilter === 'all' || quest.sea === currentFilter;
                const matchCategory = currentCategory === 'all' || quest.category === currentCategory;
                const matchSearch = quest.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  quest.location.toLowerCase().includes(searchTerm.toLowerCase()) ||
                                  quest.reward.some(r => r.toLowerCase().includes(searchTerm.toLowerCase()));
                return matchFilter && matchCategory && matchSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="no-results">Tidak ada quest yang ditemukan. Coba kata kunci lain.</div>';
                return;
            }

            filtered.forEach(quest => {
                const card = document.createElement('div');
                card.className = 'quest-card';
                card.innerHTML = `
                    <div class="quest-header">
                        <div>
                            <div class="quest-title">
                                ${quest.name}
                                <span class="difficulty-badge difficulty-${quest.difficulty}">${quest.difficulty.toUpperCase()}</span>
                            </div>
                            <span class="quest-sea">${quest.sea.replace('sea', 'Sea ')}</span>
                        </div>
                    </div>
                    <div class="quest-info">
                        <div class="info-row">
                            <span class="info-label">📍 Lokasi:</span>
                            <span>${quest.location}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">👤 NPC:</span>
                            <span>${quest.npc}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">📊 Level:</span>
                            <span>${quest.level}</span>
                        </div>
                    </div>
                    <div class="quest-reward">
                        ${quest.reward.map(r => `<span class="reward-tag">${r}</span>`).join('')}
                    </div>
                    <button class="view-guide-btn" onclick="openModal(${quest.id})">View Guide</button>
                `;
                grid.appendChild(card);
            });
        }

        function openModal(id) {
            const quest = quests.find(q => q.id === id);
            if (!quest) return;

            document.getElementById('modalTitle').textContent = quest.name;
            
            document.getElementById('modalStats').innerHTML = `
                <div class="stat-item">
                    <div class="stat-icon">📍</div>
                    <div class="stat-info">
                        <span class="stat-label">Lokasi</span>
                        <span class="stat-value">${quest.location}</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">🌊</div>
                    <div class="stat-info">
                        <span class="stat-label">Sea</span>
                        <span class="stat-value">${quest.sea.replace('sea', 'Sea ')}</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">📊</div>
                    <div class="stat-info">
                        <span class="stat-label">Level</span>
                        <span class="stat-value">${quest.level}</span>
                    </div>
                </div>
                <div class="stat-item">
                    <div class="stat-icon">👤</div>
                    <div class="stat-info">
                        <span class="stat-label">NPC</span>
                        <span class="stat-value">${quest.npc}</span>
                    </div>
                </div>
            `;

            document.getElementById('modalBody').innerHTML = `
                <div class="guide-section">
                    <h3>🎯 Reward</h3>
                    <div class="quest-reward" style="margin: 0;">
                        ${quest.reward.map(r => `<span class="reward-tag">${r}</span>`).join('')}
                    </div>
                </div>
                
                <div class="guide-section">
                    <h3>📋 Cara Menyelesaikan Quest:</h3>
                    <ol>
                        ${quest.steps.map(step => `<li>${step}</li>`).join('')}
                    </ol>
                </div>

                <div class="tip-box">
                    <strong>💡 Tips:</strong> ${quest.tips}
                </div>
            `;

            document.getElementById('questModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('questModal').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        // Event Listeners
        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchTerm = e.target.value;
            renderQuests();
        });

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                renderQuests();
            });
        });

        document.querySelectorAll('.category-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.category-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentCategory = tab.dataset.category;
                renderQuests();
            });
        });

        // Close modal on outside click
        document.getElementById('questModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('questModal')) {
                closeModal();
            }
        });

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Navigation
        function showSection(section) {
            if (section === 'home') {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else if (section === 'quests') {
                document.querySelector('.controls').scrollIntoView({ behavior: 'smooth' });
            } else if (section === 'about') {
                alert('VINCEGUIDE - Blox Fruits Quest Guide\n\nWebsite ini dibuat untuk membantu player Blox Fruits menyelesaikan quest penting dengan mudah.\n\nFitur:\n- 25+ Quest Guide\n- Filter berdasarkan Sea dan Kategori\n- Detail langkah-langkah lengkap\n- Tips dan trik untuk setiap quest\n\nSelamat bermain! ⚔️');
            }
        }

        // Initial render
        renderQuests();
    </script>
